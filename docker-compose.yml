# docker compose up --build  ->  http://localhost:3000 (demo users: anna / piotr, password demo1234)
# For development only the database is needed: docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paymatch
      POSTGRES_USER: paymatch
      POSTGRES_PASSWORD: paymatch
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymatch -d paymatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/paymatch
      DB_USER: paymatch
      DB_PASSWORD: paymatch
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
