server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # same limit as the backend multipart setting
    client_max_body_size 10m;

    # the API and its docs are served from the same origin, so the session cookie and CSRF token just work
    location ~ ^/(api|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # file names contain a content hash, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
